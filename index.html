<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4ede6"><title>My Life Planner</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#433c38;background:#f8f4ef}*{box-sizing:border-box}body{margin:0}.app{max-width:680px;margin:auto;padding:20px 18px 110px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:8px 0}h2{font-size:20px}.sub{color:#8c817a}.card{background:white;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #7865520b}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;overflow:auto;justify-content:center;padding:10px 4px calc(12px + env(safe-area-inset-bottom))}.tabs button{border:0;background:none;min-width:66px;padding:8px 5px;color:#776a62;font-size:11px}.tabs button.active{color:#9c6e55;font-weight:800;background:#f5ebe4;border-radius:14px}button{cursor:pointer}button.primary{background:#a77d67;color:white;border:0;border-radius:13px;padding:13px 17px;font-weight:700}button.small{border:0;border-radius:10px;padding:8px 10px;background:#eee3dc;color:#624b3e}input,textarea,select{width:100%;border:1px solid #e4d9d0;border-radius:12px;padding:13px;font:inherit;background:white;margin:5px 0 11px}textarea{min-height:90px}label{font-size:13px;color:#776a62}.item{display:flex;align-items:center;gap:12px;border-bottom:1px solid #f2eeea;padding:13px 0}.item:last-child{border:0}.item .main{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;opacity:.5}.pill{background:#f3e8df;border-radius:30px;padding:7px 12px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{font-size:27px;font-weight:750;color:#986c55}.hidden{display:none}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.muted{font-size:13px;color:#897c74}.danger{color:#b24f4f!important}input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:#a77d67}input[type=date]{min-width:0}</style></head><body><main class="app"><header><div><div class="sub" id="today"></div><h1>My Life Planner ✨</h1></div><button class="small" id="lang">EN</button></header><div id="view"></div></main><nav class="tabs" id="tabs"></nav><script>
const K='my-life-planner-v1';let db;try{db=JSON.parse(localStorage.getItem(K))||{}}catch{db={}};for(const x of ['tasks','events','shopping','notes','expenses'])db[x]??=[];db.lang??='it';let page='home';const t=(it,en)=>db.lang==='it'?it:en;const today=()=>new Date().toLocaleDateString('en-CA');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch{alert(t('Memoria piena','Storage full'))}};const add=(type,values)=>{db[type].push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),...values});save();render()};const del=(type,id)=>{db[type]=db[type].filter(x=>x.id!==id);save();render()};const toggle=(type,id)=>{let x=db[type].find(x=>x.id===id);if(x)x.done=!x.done;save();render()};const repeatDate=(e)=>{if(e.repeat==='daily')return true;if(e.repeat==='weekly')return new Date(e.date+'T12:00:00').getDay()===new Date().getDay();return e.date===today()};const titles={home:['Oggi','Today'],calendar:['Calendario','Calendar'],tasks:['Attività','Tasks'],shopping:['Spesa','Shopping'],notes:['Note','Notes'],expenses:['Spese','Expenses']};const names={home:'⌂',calendar:'▦',tasks:'✓',shopping:'🛒',notes:'✎',expenses:'€'};const empty=()=>`<p class="muted">${t('Ancora nessun elemento','Nothing here yet')}</p>`;const list=(type,arr,formatter,check=false)=>arr.length?arr.map(x=>`<div class="item">${check?`<input type="checkbox" ${x.done?'checked':''} onchange="toggle('${type}','${x.id}')">`:''}<div class="main ${x.done?'done':''}">${formatter(x)}</div><button class="small danger" onclick="del('${type}','${x.id}')">✕</button></div>`).join(''):empty();const form=(id,content)=>`<form class="card" id="${id}">${content}<button class="primary" type="submit">＋ ${t('Aggiungi','Add')}</button></form>`;const field=(name,label,type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" ${extra} required></label>`;function render(){document.documentElement.lang=db.lang;document.getElementById('today').textContent=new Date().toLocaleDateString(db.lang==='it'?'it-IT':'en-US',{weekday:'long',day:'numeric',month:'long'});document.getElementById('lang').textContent=db.lang==='it'?'EN':'IT';document.getElementById('tabs').innerHTML=Object.keys(titles).map(p=>`<button class="${page===p?'active':''}" onclick="page='${p}';render()"><div style="font-size:20px">${names[p]}</div>${t(...titles[p])}</button>`).join('');let h='';if(page==='home'){let pending=db.tasks.filter(x=>!x.done),upcoming=db.events.filter(repeatDate);h=`<h2>${t('La tua giornata','Your day')}</h2><div class="grid"><div class="card"><div class="stat">${pending.length}</div>${t('Attività aperte','Open tasks')}</div><div class="card"><div class="stat">${upcoming.length}</div>${t('Appuntamenti oggi','Events today')}</div></div><div class="card"><h2>${t('Da fare','To do')}</h2>${list('tasks',pending,x=>esc(x.title),true)}</div><div class="card"><h2>${t('Appuntamenti','Appointments')}</h2>${list('events',upcoming,x=>`<b>${esc(x.title)}</b><div class="muted">${esc(x.time||'')}</div>`)}</div>`}if(page==='calendar'){h=`<h2>${t('Appuntamenti','Appointments')}</h2>`+form('eventform',field('title',t('Titolo','Title'))+field('date',t('Data','Date'),'date',`value="${today()}"`)+`<label>${t('Ora','Time')}<input name="time" type="time"></label><label>${t('Ripeti','Repeat')}<select name="repeat"><option value="none">${t('Mai','Never')}</option><option value="daily">${t('Ogni giorno','Daily')}</option><option value="weekly">${t('Ogni settimana','Weekly')}</option></select></label>`)+`<div class="card">${list('events',[...db.events].sort((a,b)=>a.date.localeCompare(b.date)),x=>`<b>${esc(x.title)}</b><div class="muted">${esc(x.date)} ${esc(x.time||'')} ${x.repeat!=='none'?'↻':''}</div>`)}</div>`}if(page==='tasks'){h=`<h2>${t('Le mie attività','My tasks')}</h2>`+form('taskform',field('title',t('Nuova attività','New task')))+`<div class="card">${list('tasks',db.tasks,x=>esc(x.title),true)}</div>`}if(page==='shopping'){h=`<h2>${t('Lista della spesa','Shopping list')}</h2>`+form('shoppingform',field('title',t('Prodotto','Product')))+`<div class="card">${list('shopping',db.shopping,x=>esc(x.title),true)}</div>`}if(page==='notes'){h=`<h2>${t('Le mie note','My notes')}</h2>`+form('noteform',`<label>${t('Titolo','Title')}<input name="title" required></label><label>${t('Testo','Text')}<textarea name="body" required></textarea></label>`)+`<div class="card">${list('notes',db.notes,x=>`<b>${esc(x.title)}</b><p>${esc(x.body).replace(/\n/g,'<br>')}</p>`)}</div>`}if(page==='expenses'){let sum=db.expenses.reduce((s,x)=>s+Number(x.amount),0);h=`<h2>${t('Le mie spese','My expenses')}</h2><div class="card"><div class="muted">${t('Totale registrato','Total recorded')}</div><div class="stat">${sum.toLocaleString(db.lang==='it'?'it-IT':'en-US',{style:'currency',currency:'EUR'})}</div></div>`+form('expenseform',field('title',t('Descrizione','Description'))+field('amount',t('Importo (€)','Amount (€)'),'number','min="0.01" step="0.01"'))+`<div class="card">${list('expenses',db.expenses,x=>`<b>${esc(x.title)}</b><div class="muted">€ ${Number(x.amount).toFixed(2)}</div>`)}</div>`}document.getElementById('view').innerHTML=h;for(const [form,type,fn] of [['eventform','events',d=>({title:d.get('title'),date:d.get('date'),time:d.get('time'),repeat:d.get('repeat')})],['taskform','tasks',d=>({title:d.get('title'),done:false})],['shoppingform','shopping',d=>({title:d.get('title'),done:false})],['noteform','notes',d=>({title:d.get('title'),body:d.get('body')})],['expenseform','expenses',d=>({title:d.get('title'),amount:Number(d.get('amount'))})]]){let el=document.getElementById(form);if(el)el.onsubmit=e=>{e.preventDefault();add(type,fn(new FormData(el)))}}}document.getElementById('lang').onclick=()=>{db.lang=db.lang==='it'?'en':'it';save();render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
